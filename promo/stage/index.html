<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Grok Bot Inbox promo</title>
  <style>
    @font-face { font-family: Inter; src: local("Inter"); font-weight: 400; font-display: block; }
    @font-face { font-family: Inter; src: local("Inter Medium"); font-weight: 500; font-display: block; }
    @font-face { font-family: Inter; src: local("Inter SemiBold"); font-weight: 600; font-display: block; }
    @font-face { font-family: "JetBrains Mono"; src: local("JetBrains Mono"); font-weight: 400; font-display: block; }
    html, body { margin: 0; background: #070708; overflow: hidden; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #fafafa;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    #root { position: relative; overflow: hidden; background: #070708; }
    .layer { position: absolute; inset: 0; }
    .kicker {
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #9a9aa3;
      font-size: 12px;
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./stage.js"></script>
</body>
</html>
